[workspace]
members = ["crates/core"]
# Without this, `cargo test` and friends would skip the core crate.
default-members = [".", "crates/core"]

[package]
name = "mantisgit"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
mantisgit-core = { path = "crates/core" }
gpui-kit = "0.9.1"
chrono = "0.4"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
mantisgit-core = { path = "crates/core", features = ["testing"] }
gpui-kit = { version = "0.9.1", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

# Renders through the real GPU pipeline, so it is opt-in and not part of `cargo test`:
#   cargo test --test render
[[test]]
name = "render"
harness = false
test = false

# gpui builds and lays out the whole window on every pointer move while dragging, which
# is far too slow unoptimised. Our own crates stay at opt-level 0 for fast rebuilds.
[profile.dev.package."*"]
opt-level = 3

# Release binaries are shipped as downloads, so size matters more than build time. Without
# this the binary keeps its symbols and gets no cross-crate inlining across gpui.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
