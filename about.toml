# Licenses the build may depend on. A crate under any other license fails `cargo about`.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "GPL-3.0-or-later",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
workarounds = ["ring"]
