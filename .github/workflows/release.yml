# Every push to main updates a "Release PR" holding the next version and changelog.
# Nothing is released until that PR is merged. Merging it tags the release, then
# the jobs below build the binaries and publish the draft GitHub Release.
name: Release

# Paused: releases are made on Gitea for now (see .gitea/workflows/release.yml), so this
# only runs by hand. To bring automatic releases back, swap `workflow_dispatch` for:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          target-branch: main
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  build:
    name: Build (${{ matrix.target }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          cd "target/$TARGET/release"
          archive="$GITHUB_WORKSPACE/gitclient-$TAG-$TARGET.$EXT"
          if [ "$EXT" = zip ]; then
            7z a "$archive" gitclient.exe
          else
            tar -czf "$archive" gitclient
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: gitclient-*.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Attach binaries and publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          sha256sum gitclient-* > SHA256SUMS.txt
          # The same licenses are inside the program (Settings, About), and are here too
          # for anyone who reads the release page first.
          cp "$GITHUB_WORKSPACE/LICENSE" "$GITHUB_WORKSPACE/THIRD-PARTY-LICENSES.txt" .
          gh release upload "$TAG" gitclient-* SHA256SUMS.txt LICENSE THIRD-PARTY-LICENSES.txt --clobber
          gh release edit "$TAG" --draft=false --latest
