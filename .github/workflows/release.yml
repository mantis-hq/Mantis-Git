# Push a tag like v0.2.0 to build Linux and Windows and publish a release. Every push to
# main does the same into one "nightly" pre-release that is replaced each time. "Run
# workflow" builds both without publishing.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only pushes to main don't build a nightly. Tag pushes ignore this filter.
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".github/workflows/ci.yml"
      - ".github/workflows/licenses.yml"
  workflow_dispatch:

# A newer push to the same ref stops the build still running for it. Tags have their own
# group, so a nightly never cancels a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THIRD-PARTY-LICENSES.txt is compiled into the program. It is made here from Cargo.lock
  # so no build can ship a stale one, and the jobs below use this copy. A release tag on a
  # commit whose committed copy differs fails, until the licenses pull request is merged.
  licenses:
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker' }}
    container:
      image: rust:1-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/bin/cargo-about
          key: licenses-${{ hashFiles('Cargo.lock') }}
          restore-keys: licenses-
      - run: command -v cargo-about >/dev/null || cargo install --locked cargo-about --features cli
      - run: cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES.txt
      - name: A release must match the committed file
        if: startsWith(github.ref, 'refs/tags/')
        run: git diff --exit-code THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@v7
        with:
          name: licenses
          path: THIRD-PARTY-LICENSES.txt

  test:
    needs: licenses
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker' }}
    container:
      image: rust:1-trixie
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: licenses
          path: .
      - run: sh .github/ci-setup.sh
      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: test-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-
      - run: cargo test --locked --workspace

  linux:
    needs: [licenses, test]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker' }}
    container:
      image: rust:1-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: licenses
          path: .
      - run: sh .github/ci-setup.sh
      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: build-${{ hashFiles('Cargo.lock') }}
          restore-keys: build-
      - run: cargo build --release --locked
      - name: Package
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) tag="$GITHUB_REF_NAME" ;;
            *) tag=nightly ;;
          esac
          mkdir dist
          tar -czf "dist/mantisgit-$tag-x86_64-unknown-linux-gnu.tar.gz" \
            -C target/release mantisgit
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  windows:
    needs: [licenses, test]
    runs-on: ${{ github.server_url == 'https://github.com' && 'windows-latest' || 'windows' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: licenses
          path: .
      - run: cargo build --release --locked
      - name: Package
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) tag="$GITHUB_REF_NAME" ;;
            *) tag=nightly ;;
          esac
          mkdir dist
          powershell -NoProfile -Command "Compress-Archive -Path target/release/mantisgit.exe -DestinationPath dist/mantisgit-$tag-x86_64-pc-windows-msvc.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  publish:
    needs: [linux, windows]
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker' }}
    container:
      image: rust:1-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends nodejs jq
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: licenses
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - run: cd dist && sha256sum mantisgit-* > SHA256SUMS.txt
      # The same licenses are inside the program (Settings, About), and are here too for
      # anyone who reads the release page first.
      - run: cp LICENSE THIRD-PARTY-LICENSES.txt dist/
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TOKEN: ${{ github.token }}
        run: sh .github/release-publish.sh release
      - name: Publish nightly
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          TOKEN: ${{ github.token }}
        run: sh .github/release-publish.sh nightly
