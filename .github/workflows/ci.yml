name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # The licenses inside the program are generated from Cargo.lock, so they have to be made
  # again whenever a dependency changes. A license `about.toml` doesn't accept fails here too.
  licenses:
    name: Licenses are up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo install --locked --version 0.9.3 --features cli cargo-about
      - run: cargo about generate --locked about.hbs -o "$RUNNER_TEMP/licenses.txt"
      - run: diff THIRD-PARTY-LICENSES.txt "$RUNNER_TEMP/licenses.txt"
