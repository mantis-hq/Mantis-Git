# What a pull request has to pass before it can be merged. The release workflow runs the
# tests again before it builds anything, so a change that reaches main has been through both.
# Gitea runs it from here when it has no .gitea/workflows folder.
#
# The workflow always runs, so it can be a required check. A first job reads which files the
# pull request changed, and each check after it runs only when it has something to look at;
# the rest show as skipped. A pull request that touches only docs runs no checks at all.
name: CI

on:
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request stops the run still going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: docker
    container:
      image: rust:1-bookworm
    outputs:
      code: ${{ steps.what.outputs.code }}
      licenses: ${{ steps.what.outputs.licenses }}
    steps:
      # The Rust image has no Node, which the JavaScript actions below need.
      - run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: what
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            # A run started by hand checks everything.
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "licenses=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")
          echo "$files"
          # What can change whether the program builds, passes its tests or is formatted.
          if echo "$files" | grep -Eq '^(crates/|src/|tests/|assets/|build\.rs$|Cargo\.(toml|lock)$|\.github/(workflows/ci\.yml|ci-setup\.sh|actions/))'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # What the license file is written from, and the file itself.
          if echo "$files" | grep -Eq '^(Cargo\.lock|about\.toml|about\.hbs|THIRD-PARTY-LICENSES\.txt|\.github/workflows/ci\.yml)$'; then
            echo "licenses=true" >> "$GITHUB_OUTPUT"
          else
            echo "licenses=false" >> "$GITHUB_OUTPUT"
          fi

  # The three checks that build run side by side, so the pull request waits for the slowest
  # and not for the sum. Formatting needs no libraries and no build.
  fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      # Plain `cargo fmt` skips crates/core.
      - run: cargo fmt --all --check

  clippy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v7
      - run: sh .github/ci-setup.sh
      - run: rustup component add clippy
      # Its own cache: clippy and the tests build different things, and one key for both
      # would keep overwriting the other.
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: clippy-
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v7
      - run: sh .github/ci-setup.sh
      # The same cache as the release workflow's test job.
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: test-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-
      - run: cargo test --locked --workspace

  # The licenses inside the program are written from Cargo.lock into THIRD-PARTY-LICENSES.txt.
  # This fails when that file is out of date, or when a dependency has a license about.toml
  # doesn't accept.
  licenses:
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v7
      # Only the tool is cached: cargo-about reads Cargo.lock and builds nothing.
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/bin/cargo-about
          key: licenses-${{ hashFiles('Cargo.lock') }}
          restore-keys: licenses-
      - run: command -v cargo-about >/dev/null || cargo install --locked cargo-about --features cli
      - run: cargo about generate --locked about.hbs -o "$RUNNER_TEMP/licenses.txt"
      - run: diff -u THIRD-PARTY-LICENSES.txt "$RUNNER_TEMP/licenses.txt"
