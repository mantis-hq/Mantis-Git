[package]
name = "gitclient-core"
# release-please keeps this in step with the app, and can't update an inherited version.
version = "0.1.0"
edition = "2024"
publish = false

[features]
# The throwaway repository in `testing.rs`, for the app's own tests.
testing = []

[dependencies]
async-channel = "2"
flate2 = "1"
portable-pty = "0.9.0"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
ureq = "3"
vt100 = "0.18.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Writes the Start menu shortcut, and only builds on Windows.
[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
